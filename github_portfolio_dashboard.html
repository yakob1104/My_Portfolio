<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הפורטפוליו שלי - GitHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .modal { transition: opacity 0.25s ease; }
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-6 shadow-lg">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <img id="avatar" class="w-16 h-16 rounded-full border-2 border-indigo-500 shadow" src="" alt="Avatar" style="display:none;">
                <div>
                    <h1 id="user-name" class="text-2xl font-bold text-white">טוען פרופיל...</h1>
                    <p id="user-bio" class="text-slate-400 text-sm"></p>
                </div>
            </div>
            <a id="github-link" href="#" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 border border-slate-700 transition">
                <i class="fab font-bold fa-github text-xl"></i>
                פרופיל GitHub
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto p-6 flex-grow w-full">
        <h2 class="text-xl font-semibold mb-6 flex items-center gap-2 text-indigo-400">
            <i class="fas fa-code-branch"></i>
            הפרויקטים שלי
        </h2>

        <!-- Loading / Error State -->
        <div id="status-message" class="text-center py-12 text-slate-400">
            <i class="fas fa-spinner fa-spin text-3xl mb-3 text-indigo-500"></i>
            <p>טוען את הריפוזטורים מ-GitHub...</p>
        </div>

        <!-- Repos Grid -->
        <div id="repos-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden"></div>
    </main>

    <!-- Live Demo Modal -->
    <div id="demo-modal" class="modal fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none">
        <div class="bg-slate-900 rounded-xl w-full max-w-5xl h-[85vh] flex flex-col border border-slate-700 shadow-2xl overflow-hidden">
            <div class="p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
                <h3 id="modal-title" class="font-bold text-lg text-white">תצוגה מקדימה</h3>
                <div class="flex items-center gap-3">
                    <a id="modal-external-link" href="#" target="_blank" class="text-slate-400 hover:text-white text-sm flex items-center gap-1">
                        <i class="fas fa-external-link-alt"></i> פתח בחלון חדש
                    </a>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-white text-xl px-2">&times;</button>
                </div>
            </div>
            <div class="flex-grow w-full bg-white relative">
                <iframe id="demo-iframe" class="w-full h-full border-0" src=""></iframe>
            </div>
        </div>
    </div>

    <script>
        // שם המשתמש שלך מוגדר כאן באופן קבוע!
        const USERNAME = 'yakob1104';

        async function init() {
            try {
                // 1. טעינת פרטי המשתמש
                const userRes = await fetch(`https://api.github.com/users/${USERNAME}`);
                if (!userRes.ok) throw new Error('משתמש לא נמצא');
                const userData = await userRes.json();
                
                document.getElementById('user-name').textContent = userData.name || userData.login;
                document.getElementById('user-bio').textContent = userData.bio || 'מפתח / חובב תכנות';
                document.getElementById('avatar').src = userData.avatar_url;
                document.getElementById('avatar').style.display = 'block';
                document.getElementById('github-link').href = userData.html_url;

                // 2. טעינת הריפוזטורים
                const reposRes = await fetch(`https://api.github.com/users/${USERNAME}/repos?sort=updated&per_page=100`);
                if (!reposRes.ok) throw new Error('שגיאה שטעינת הריפוזטורים');
                const repos = await reposRes.json();

                renderRepos(repos);
            } catch (err) {
                document.getElementById('status-message').innerHTML = `
                    <div class="bg-red-900/30 border border-red-500/50 rounded-lg p-4 text-red-200 max-w-md mx-auto">
                        <i class="fas fa-exclamation-triangle text-2xl mb-2 text-red-400"></i>
                        <p>לא ניתן היה לטעון את הפרויקטים עבור המשתמש <strong>${USERNAME}</strong>.</p>
                        <p class="text-xs text-red-300 mt-1">${err.message}</p>
                    </div>
                `;
            }
        }

        function renderRepos(repos) {
            const grid = document.getElementById('repos-grid');
            const statusMessage = document.getElementById('status-message');

            if (repos.length === 0) {
                statusMessage.innerHTML = '<p>לא נמצאו ריפוזטורים ציבוריים.</p>';
                return;
            }

            statusMessage.classList.add('hidden');
            grid.classList.remove('hidden');

            grid.innerHTML = repos.map(repo => {
                // בדיקה אם יש דף Pages מופעל (לפי סיומת או הגדרה)
                const hasPages = repo.has_pages;
                const pagesUrl = `https://${USERNAME}.github.io/${repo.name}/`;

                return `
                    <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-5 flex flex-col justify-between hover:border-indigo-500/50 transition">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-lg text-indigo-300 truncate" title="${repo.name}">${repo.name}</h3>
                                ${repo.language ? `<span class="text-xs bg-slate-700 text-slate-300 px-2 py-1 rounded">${repo.language}</span>` : ''}
                            </div>
                            <p class="text-slate-400 text-sm mb-4 line-clamp-2 h-10">${repo.description || 'אין תיאור לפרויקט זה.'}</p>
                        </div>
                        
                        <div class="flex items-center justify-between pt-4 border-t border-slate-700/50">
                            <a href="${repo.html_url}" target="_blank" class="text-slate-300 hover:text-white text-sm flex items-center gap-1">
                                <i class="fab fa-github"></i> קוד
                            </a>
                            
                            ${hasPages ? `
                                <button onclick="openDemo('${pagesUrl}', '${repo.name}')" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded-md flex items-center gap-1 transition">
                                    <i class="fas fa-play text-[10px]"></i> הרצה בלייב
                                </button>
                            ` : `
                                <a href="${repo.html_url}" target="_blank" class="text-slate-500 text-xs hover:text-slate-400">
                                    צפה ב-GitHub
                                </a>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openDemo(url, title) {
            const modal = document.getElementById('demo-modal');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-external-link').href = url;
            document.getElementById('demo-iframe').src = url;
            
            modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeModal() {
            const modal = document.getElementById('demo-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('demo-iframe').src = '';
        }

        init();
    </script>
</body>
</html>
